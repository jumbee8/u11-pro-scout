<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="U11 Scout"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>U11 PRO Scout</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf8f3;background:#0d1916}*{box-sizing:border-box}body{margin:0}header{background:#10251f;padding:18px 16px 12px;position:sticky;top:0;z-index:2;border-bottom:1px solid #315344}h1{font-size:22px;margin:0}small,.muted{color:#a5beb3}nav{display:flex;gap:6px;overflow-x:auto;margin-top:13px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#254b3c;color:white;font-weight:650}button:disabled{opacity:.45}button.active,.primary{background:#36c487;color:#082119}button.danger{background:#783c41}button.ghost{background:#1b3029}nav button{white-space:nowrap;font-size:13px}main{max-width:820px;margin:auto;padding:16px 14px 85px}.card{background:#172a23;border:1px solid #315044;border-radius:18px;padding:16px;margin-bottom:14px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:14px 0 8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.player{padding:11px 4px;background:#254237;border:2px solid transparent}.player.active{border-color:#55e0a4;background:#315c47}.player strong{font-size:23px;display:block}.player span{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event{min-height:69px;text-align:left;display:flex;justify-content:space-between;align-items:center}.event b{font-size:19px}.event.good{background:#23543d}.event.bad{background:#5b3639}input,select,textarea{background:#0c1d16;border:1px solid #456354;border-radius:10px;padding:12px;color:white;min-width:0;width:100%}label{display:block;font-size:13px;color:#bed3c8;margin:10px 0 5px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#203a2e;border-radius:12px;padding:12px 6px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#bad1c3}.item{padding:12px 0;border-bottom:1px solid #365143}.item:last-child{border-bottom:0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #355145}th{color:#b8d4c6}.scroll{overflow-x:auto}p{line-height:1.5}.notice{border-left:3px solid #36c487;padding-left:12px;color:#bfd7ca}.tiny{font-size:12px}.hidden{display:none!important}@media(min-width:650px){.players{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>⚽ U11 PRO Scout <small>1.0</small></h1><nav id="nav"><button data-tab="live" class="active">⚡ Élő</button><button data-tab="matches">🏟 Mérkőzések</button><button data-tab="roster">👥 Játékosok</button><button data-tab="reports">📊 Elemzés</button><button data-tab="backup">⚙️ Mentés</button></nav></header><main id="app"></main><script>
'use strict';const KEY='u11-scout-v1';const TYPES=[['pass','Pontos passz','✓',1],['badpass','Pontatlan passz','×',0],['duel','Nyert párharc','🛡',1],['lostduel','Vesztett párharc','−',0],['dribble','Sikeres csel','↗',1],['baddribble','Sikertelen csel','↘',0],['recovery','Labdaszerzés','↻',1],['shot','Kaput találó lövés','◎',1],['miss','Kaput elkerülő lövés','○',0],['goal','Gól','⚽',1],['assist','Gólpassz','★',1],['chance','Helyzetkialakítás','✦',1]];let db,tab='live',activePlayer=null,activeMatch=null;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=()=>new Date().toLocaleDateString('sv-SE');function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.players)&&Array.isArray(v.matches)&&Array.isArray(v.events))return v}catch(e){}return {players:[],matches:[],events:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('A mentés nem sikerült. Ellenőrizd a tárhelyet, és készíts biztonsági mentést!');return false}}db=load();activeMatch=db.matches.find(m=>!m.finished)?.id||null;function match(){return db.matches.find(m=>m.id===activeMatch)}function player(){return db.players.find(p=>p.id===activePlayer)}function events(mid,pid){return db.events.filter(e=>e.matchId===mid&&(!pid||e.playerId===pid))}function n(e,t){return e.filter(x=>x.type===t).length}function pct(a,b){return a+b?Math.round(a/(a+b)*100)+'%':'–'}function setTab(t){tab=t;render()}document.querySelector('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#app').innerHTML=({live:live,matches:matches,roster:roster,reports:reports,backup:backup})[tab]();}function live(){let m=match();if(!m)return `<section class="card"><h2>Első mérkőzésed</h2><p>Először vegyél fel játékosokat, majd hozz létre egy mérkőzést.</p><div class="row"><button class="primary" onclick="setTab('roster')">Játékosok felvétele</button><button onclick="setTab('matches')">Új mérkőzés</button></div></section>`;let ids=m.selected.filter(id=>db.players.some(p=>p.id===id));if(!ids.includes(activePlayer))activePlayer=ids[0]||null;let p=player(),es=events(m.id,activePlayer);return `<div class="card"><div class="row spread"><div><h2>${esc(m.opponent)} ellen</h2><small>${esc(m.date)} · ${esc(m.venue||'Helyszín nélkül')} · ${m.finished?'Lezárt':'Folyamatban'}</small></div><button class="ghost" onclick="setTab('matches')">Váltás</button></div><p class="tiny muted">Válaszd ki a játékost, majd érintsd meg az eseményt.</p><div class="players">${ids.map(id=>{let x=db.players.find(p=>p.id===id);return `<button class="player ${id===activePlayer?'active':''}" onclick="choose('${id}')"><strong>${esc(x.number||'–')}</strong><span>${esc(x.name)}</span></button>`}).join('')}</div></div>${p?`<div class="card"><div class="row spread"><h2>${esc(p.name)} · #${esc(p.number||'–')}</h2><small>${es.length} esemény</small></div><div class="grid">${TYPES.map(t=>`<button ${m.finished?'disabled':''} class="event ${t[3]?'good':'bad'}" onclick="addEvent('${t[0]}')"><span>${t[2]} ${t[1]}</span><b>${n(es,t[0])}</b></button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="ghost" ${m.finished?'disabled':''} onclick="undo()">↶ Utolsó esemény visszavonása</button></div></div><div class="card"><h2>Élő mutatók</h2>${stats(es)}</div>`:`<div class="card"><p>Nincs kiválasztott játékos. A mérkőzés szerkesztésénél jelölj ki 2–3 játékost.</p></div>`}<p class="notice tiny">Az események nem kapnak automatikus mérkőzéspercet; csak a rögzítés időpontja tárolódik. A százalékok csak akkor megbízhatók, ha minden megfelelő eseményt jelölsz.</p>`}function stats(es){return `<div class="statgrid"><div class="stat"><b>${pct(n(es,'pass'),n(es,'badpass'))}</b><span>Passzpontosság</span></div><div class="stat"><b>${pct(n(es,'duel'),n(es,'lostduel'))}</b><span>Nyert párharc</span></div><div class="stat"><b>${pct(n(es,'dribble'),n(es,'baddribble'))}</b><span>Sikeres csel</span></div><div class="stat"><b>${n(es,'goal')}</b><span>Gól</span></div><div class="stat"><b>${n(es,'assist')}</b><span>Gólpassz</span></div><div class="stat"><b>${n(es,'recovery')}</b><span>Labdaszerzés</span></div></div>`}function choose(id){activePlayer=id;render()}function addEvent(type){let m=match();if(!m||m.finished||!activePlayer)return;db.events.push({id:uid(),matchId:m.id,playerId:activePlayer,type,at:new Date().toISOString()});save();render()}function undo(){let i=db.events.findLastIndex(e=>e.matchId===activeMatch&&e.playerId===activePlayer);if(i<0)return;db.events.splice(i,1);save();render()}
function roster(){return `<section class="card"><h2>Új játékos</h2><form onsubmit="addPlayer(event)"><div class="fieldrow"><div><label>Név vagy becenév</label><input name="name" maxlength="60" required placeholder="Pl. Játékos A"></div><div><label>Mezszám</label><input name="number" maxlength="4" placeholder="10"></div></div><label>Poszt (nem kötelező)</label><select name="position"><option value="">Nincs megadva</option><option>Kapus</option><option>Védő</option><option>Középpályás</option><option>Támadó</option></select><p><button class="primary" type="submit">+ Játékos hozzáadása</button></p></form></section><section class="card"><h2>Játékoskeret (${db.players.length})</h2>${db.players.length?db.players.map(p=>`<div class="item row spread"><span><b>#${esc(p.number||'–')} ${esc(p.name)}</b><br><small>${esc(p.position||'Nincs poszt')}</small></span><div class="row"><button class="ghost" onclick="editPlayer('${p.id}')">Szerkesztés</button><button class="danger" onclick="deletePlayer('${p.id}')">Törlés</button></div></div>`).join(''):'<p class="muted">Még nincs játékos.</p>'}</section>`}function addPlayer(ev){ev.preventDefault();let f=new FormData(ev.target);db.players.push({id:uid(),name:String(f.get('name')).trim(),number:String(f.get('number')).trim(),position:String(f.get('position'))});save();render()}function editPlayer(id){let p=db.players.find(p=>p.id===id);if(!p)return;let name=prompt('Játékos neve',p.name);if(name===null||!name.trim())return;let number=prompt('Mezszám',p.number);if(number===null)return;p.name=name.trim();p.number=number.trim();save();render()}function deletePlayer(id){if(!confirm('Törlöd a játékost? A korábbi statisztikái is törlődnek!'))return;db.players=db.players.filter(p=>p.id!==id);db.events=db.events.filter(e=>e.playerId!==id);db.matches.forEach(m=>m.selected=m.selected.filter(x=>x!==id));save();render()}
function matches(){return `<section class="card"><h2>Új mérkőzés</h2><form onsubmit="addMatch(event)"><div class="fieldrow"><div><label>Ellenfél</label><input name="opponent" maxlength="70" required placeholder="Pl. Nyíregyháza"></div><div><label>Dátum</label><input type="date" name="date" value="${date()}" required></div></div><label>Helyszín (nem kötelező)</label><input name="venue" maxlength="80" placeholder="Hazai / idegenbeli"><h3>Megfigyelt játékosok (javasolt 2–3)</h3>${db.players.length?db.players.map(p=>`<label class="row" style="margin:8px 0"><input style="width:auto" type="checkbox" name="selected" value="${p.id}"> #${esc(p.number||'–')} ${esc(p.name)}</label>`).join(''):'<p>Előbb vegyél fel játékosokat.</p>'}<p><button class="primary" ${!db.players.length?'disabled':''} type="submit">Mérkőzés létrehozása</button></p></form></section><section class="card"><h2>Korábbi mérkőzések</h2>${db.matches.length?db.matches.slice().reverse().map(m=>`<div class="item"><div class="row spread"><div><b>${esc(m.opponent)}</b><br><small>${esc(m.date)} · ${m.selected.length} megfigyelt játékos · ${events(m.id).length} esemény · ${m.finished?'Lezárt':'Folyamatban'}</small></div><button class="primary" onclick="openMatch('${m.id}')">Megnyitás</button></div><div class="row" style="margin-top:9px"><button class="ghost" onclick="editSelection('${m.id}')">Játékosok</button><button class="ghost" onclick="toggleFinished('${m.id}')">${m.finished?'Újranyitás':'Lezárás'}</button><button class="danger" onclick="deleteMatch('${m.id}')">Törlés</button></div></div>`).join(''):'<p class="muted">Még nincs mérkőzés.</p>'}</section>`}function addMatch(ev){ev.preventDefault();let f=new FormData(ev.target),selected=f.getAll('selected');if(!selected.length)return alert('Válassz legalább egy játékost!');let m={id:uid(),opponent:String(f.get('opponent')).trim(),date:String(f.get('date')),venue:String(f.get('venue')).trim(),selected,finished:false};db.matches.push(m);activeMatch=m.id;activePlayer=selected[0];save();setTab('live')}function openMatch(id){activeMatch=id;activePlayer=null;setTab('live')}function toggleFinished(id){let m=db.matches.find(x=>x.id===id);m.finished=!m.finished;save();render()}function editSelection(id){let m=db.matches.find(x=>x.id===id);let answer=prompt('Add meg a megfigyelni kívánt játékosok mezszámait vesszővel elválasztva. Azonos mezszám esetén a játékoskeretben szereplő első játékos lesz kiválasztva.',m.selected.map(id=>db.players.find(p=>p.id===id)?.number).filter(Boolean).join(','));if(answer===null)return;let nums=answer.split(',').map(s=>s.trim());let ids=nums.map(v=>db.players.find(p=>p.number===v)?.id).filter(Boolean);if(!ids.length)return alert('Nem található megadott mezszám.');m.selected=[...new Set(ids)];save();render()}function deleteMatch(id){if(!confirm('A mérkőzést és minden eseményét végleg törlöd?'))return;db.matches=db.matches.filter(m=>m.id!==id);db.events=db.events.filter(e=>e.matchId!==id);if(activeMatch===id)activeMatch=null;save();render()}
function reports(){return `<section class="card"><h2>Játékosok mérkőzésstatisztikája</h2><p class="muted tiny">A táblázat minden rögzített mérkőzést tartalmaz. Az üres érték azt jelenti, hogy nincs elég adat.</p><div class="scroll"><table><thead><tr><th>Játékos</th><th>Meccs</th><th>Passz</th><th>Párharc</th><th>Csel</th><th>Gól</th><th>Gólpassz</th><th>Labdaszerzés</th></tr></thead><tbody>${db.players.map(p=>{let es=db.events.filter(e=>e.playerId===p.id);let ms=db.matches.filter(m=>m.selected.includes(p.id)).length;return `<tr><td>${esc(p.name)}</td><td>${ms}</td><td>${pct(n(es,'pass'),n(es,'badpass'))}</td><td>${pct(n(es,'duel'),n(es,'lostduel'))}</td><td>${pct(n(es,'dribble'),n(es,'baddribble'))}</td><td>${n(es,'goal')}</td><td>${n(es,'assist')}</td><td>${n(es,'recovery')}</td></tr>`}).join('')}</tbody></table></div><p><button class="primary" onclick="exportCSV()">⬇ Részletes CSV-export (Excel)</button></p></section><section class="card"><h2>Mérkőzésenkénti bontás</h2>${db.matches.slice().reverse().map(m=>`<div class="item"><b>${esc(m.opponent)} · ${esc(m.date)}</b><div class="scroll"><table><thead><tr><th>Játékos</th><th>Pontos/összes passz</th><th>Nyert/összes párharc</th><th>Gól</th></tr></thead><tbody>${m.selected.map(id=>{let p=db.players.find(p=>p.id===id);if(!p)return '';let es=events(m.id,id);return `<tr><td>${esc(p.name)}</td><td>${n(es,'pass')}/${n(es,'pass')+n(es,'badpass')}</td><td>${n(es,'duel')}/${n(es,'duel')+n(es,'lostduel')}</td><td>${n(es,'goal')}</td></tr>`}).join('')}</tbody></table></div></div>`).join('')||'<p class="muted">Még nincs mérkőzés.</p>'}</section>`}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportCSV(){let head=['Dátum','Ellenfél','Játékos','Mezszám',...TYPES.map(t=>t[1]),'Passzpontosság %','Párharc %','Csel %'];let rows=[head];db.matches.forEach(m=>m.selected.forEach(id=>{let p=db.players.find(p=>p.id===id);if(!p)return;let es=events(m.id,id);let percent=(a,b)=>a+b?Math.round(100*a/(a+b)):'';rows.push([m.date,m.opponent,p.name,p.number,...TYPES.map(t=>n(es,t[0])),percent(n(es,'pass'),n(es,'badpass')),percent(n(es,'duel'),n(es,'lostduel')),percent(n(es,'dribble'),n(es,'baddribble'))])}));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('u11-scout-statisztika.csv',csv,'text/csv;charset=utf-8')}
function backup(){return `<section class="card"><h2>Biztonsági mentés</h2><p>A statisztikák ezen a készüléken, a böngésző helyi tárhelyén tárolódnak. Készíts rendszeresen biztonsági mentést!</p><button class="primary" onclick="backupJSON()">⬇ Teljes mentés letöltése</button><label>Korábbi mentés visszaállítása</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="notice tiny">A visszaállítás lecseréli a jelenlegi adatokat. A CSV csak statisztikai export; a teljes visszaállításhoz a JSON-mentés kell.</p></section><section class="card"><h2>Adatvédelem</h2><p class="tiny">Az alkalmazás nem küld adatot szerverre. A közzétett weboldal viszont önmagában nem jelszóvédett, ezért az eszközhöz való hozzáférést védd képernyőzárral. Gyermekeknél használj becenevet vagy azonosítót, és csak megfelelő jogosultsággal rögzíts személyes adatokat.</p><p class="tiny">Ha törlöd a böngésző webhelyadatait, az itt tárolt statisztika elveszhet. Másik készüléken a JSON-mentés importálásával folytathatod.</p></section>`}function backupJSON(){download('u11-scout-mentes-'+date()+'.json',JSON.stringify({format:'u11-scout-v1',...db},null,2),'application/json')}async function restore(ev){let file=ev.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.players)||!Array.isArray(v.matches)||!Array.isArray(v.events))throw Error('Hibás fájl');if(!confirm('Felülírod az összes jelenlegi játékost, mérkőzést és eseményt?'))return;db={players:v.players,matches:v.matches,events:v.events};activeMatch=null;activePlayer=null;save();render();alert('A visszaállítás sikerült.')}catch(e){alert('Nem sikerült beolvasni a mentést.')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
